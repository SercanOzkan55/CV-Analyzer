name: Build Local Worker

# PyInstaller can't cross-compile, so each platform's binary has to be built
# ON that platform -- this matrix builds all three from the same
# local_worker/CV Analyzer Local Worker.spec (see that file's comments for
# how it branches per-OS). Manual trigger only for now: these are full
# from-scratch PySide6 builds on three OSes, not something to run on every
# push.
on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: local-worker-windows
            artifact_path: "local_worker/dist/CV Analyzer Local Worker.exe"
          - os: macos-latest
            artifact_name: local-worker-macos
            artifact_path: "local_worker/dist/CV Analyzer Local Worker.app"
          - os: ubuntu-latest
            artifact_name: local-worker-linux
            artifact_path: "local_worker/dist/CV Analyzer Local Worker"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ubuntu CI images don't ship the X11/xcb/OpenGL runtime libraries a
      # Qt Quick app needs to even import PySide6.QtQuick, let alone bundle
      # correctly -- these are the commonly-needed ones for headless
      # PySide6/PyQt builds.
      - name: Install Qt runtime libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      # The .ico bundled for Windows isn't a valid macOS app icon format --
      # generate a proper .icns from the source PNG using macOS's own
      # (unavailable on other runners) icon tools. The spec file bundles
      # this only if it exists, so Windows/Linux builds are unaffected.
      - name: Generate macOS .icns
        if: matrix.os == 'macos-latest'
        run: |
          cd local_worker
          mkdir -p logo.iconset
          sips -z 16 16     assets/logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32     assets/logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64     assets/logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256   assets/logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512   assets/logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/logo.png --out logo.iconset/icon_512x512.png
          sips -z 1024 1024 assets/logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o assets/logo.icns
          rm -rf logo.iconset

      - name: Install dependencies
        working-directory: local_worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        working-directory: local_worker
        run: pyinstaller --noconfirm --clean "CV Analyzer Local Worker.spec"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
