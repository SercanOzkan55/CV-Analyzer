name: Build Local Worker

# PyInstaller cannot cross-compile. Build and smoke-test each supported OS/CPU
# on a native runner, then upload files whose names match production.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "local-worker-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            artifact_name: local-worker-windows-x64
            app_executable: "local_worker/dist/CV Analyzer Local Worker.exe"
            artifact_path: "local_worker/dist/CV Analyzer Local Worker.exe"
          - os: macos-15
            platform: macos
            arch: arm64
            artifact_name: local-worker-macos-arm64
            app_executable: "local_worker/dist/CV Analyzer Local Worker.app/Contents/MacOS/CV Analyzer Local Worker"
            artifact_path: "local_worker/dist/CV Analyzer Local Worker-macOS-arm64.zip"
          - os: macos-15-intel
            platform: macos
            arch: x64
            artifact_name: local-worker-macos-x64
            app_executable: "local_worker/dist/CV Analyzer Local Worker.app/Contents/MacOS/CV Analyzer Local Worker"
            artifact_path: "local_worker/dist/CV Analyzer Local Worker-macOS-x64.zip"
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            artifact_name: local-worker-linux-x64
            app_executable: "local_worker/dist/CV Analyzer Local Worker"
            artifact_path: "local_worker/dist/CV Analyzer Local Worker-linux-x64"
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            artifact_name: local-worker-linux-arm64
            app_executable: "local_worker/dist/CV Analyzer Local Worker"
            artifact_path: "local_worker/dist/CV Analyzer Local Worker-linux-arm64"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local_worker/requirements.txt

      - name: Install Qt runtime libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Generate macOS icon
        if: matrix.platform == 'macos'
        run: |
          cd local_worker
          mkdir -p logo.iconset
          sips -z 16 16     assets/logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32     assets/logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64     assets/logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256   assets/logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512   assets/logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/logo.png --out logo.iconset/icon_512x512.png
          sips -z 1024 1024 assets/logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o assets/logo.icns
          rm -rf logo.iconset

      - name: Install dependencies
        working-directory: local_worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source QML
        working-directory: local_worker
        run: python _verify_qml.py

      - name: Build native application
        working-directory: local_worker
        run: pyinstaller --noconfirm --clean "CV Analyzer Local Worker.spec"

      - name: Smoke-test packaged application
        shell: python
        env:
          APP_EXECUTABLE: ${{ matrix.app_executable }}
        run: |
          import os, subprocess
          from pathlib import Path

          app = os.environ["APP_EXECUTABLE"]
          report = Path("worker-smoke-report.txt").resolve()
          child_env = os.environ.copy()
          child_env["CV_WORKER_SMOKE_REPORT"] = str(report)
          try:
              result = subprocess.run(
                  [app, "--smoke-test"],
                  check=False,
                  timeout=60,
                  env=child_env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
          except subprocess.TimeoutExpired:
              print("::error title=Packaged smoke test timed out::Application did not exit within 60 seconds")
              raise
          process_output = result.stdout or ""
          details = report.read_text(encoding="utf-8", errors="replace") if report.exists() else "No smoke report was created"
          if process_output:
              details = f"{details}\nProcess output:\n{process_output}"
          print(details)
          if result.returncode != 0:
              annotation = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:4000]
              print(f"::error title=Packaged smoke test failed::{annotation}")
              raise SystemExit(f"Packaged smoke test failed with exit code {result.returncode}")

      - name: Verify architecture and package application (macOS)
        if: matrix.platform == 'macos'
        working-directory: local_worker
        run: |
          file "dist/CV Analyzer Local Worker.app/Contents/MacOS/CV Analyzer Local Worker" | grep -q "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/CV Analyzer Local Worker.app" \
            "dist/CV Analyzer Local Worker-macOS-${{ matrix.arch }}.zip"

      - name: Verify architecture and name application (Linux)
        if: matrix.platform == 'linux'
        working-directory: local_worker
        run: |
          file "dist/CV Analyzer Local Worker" | grep -q "${{ matrix.arch == 'arm64' && 'aarch64' || 'x86-64' }}"
          mv "dist/CV Analyzer Local Worker" "dist/CV Analyzer Local Worker-linux-${{ matrix.arch }}"
          chmod +x "dist/CV Analyzer Local Worker-linux-${{ matrix.arch }}"

      - name: Verify artifact and create SHA-256
        shell: python
        env:
          ARTIFACT_PATH: ${{ matrix.artifact_path }}
        run: |
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ["ARTIFACT_PATH"])
          assert path.is_file(), f"missing artifact: {path}"
          assert path.stat().st_size > 1_000_000, f"artifact is unexpectedly small: {path.stat().st_size}"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_name(path.name + ".sha256").write_text(f"{digest}  {path.name}\n", encoding="utf-8")
          print(f"{path}: {path.stat().st_size} bytes, sha256={digest}")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_path }}
            ${{ matrix.artifact_path }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/local-worker-v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: local-worker-*
          path: release-assets
          merge-multiple: true

      - name: Publish public Local Worker release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CV Analyzer Local Worker ${GITHUB_REF_NAME#local-worker-v}" \
            --notes "Free Local Worker builds for Windows x64, macOS Apple Silicon, macOS Intel, Linux x64, and Linux ARM64. Every file was smoke-tested on its native GitHub runner; SHA-256 checksums are attached. macOS and Windows builds are currently unsigned."
          find release-assets -type f -print0 | \
            xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
